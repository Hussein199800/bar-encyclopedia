<!DOCTYPE html>
<html lang="ar" dir="rtl">

    <!-- الوضع النهاري/الليلي قبل رسم الصفحة (بلا وميض). مفاتيح التخزين تبدأ بـ enc_ فقط. -->
    <script>
        (function () {
            var t = null;
            try { t = localStorage.getItem("enc_ui_theme"); } catch (e) {}
            if (t !== "dark" && t !== "light") {
                t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
            }
            document.documentElement.setAttribute("data-theme", t);
        })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="موسوعة قانونية وإدارية ومالية لنقابة المحامين السورية وفروعها: قانون تنظيم المهنة، النظام الداخلي، النظام المالي، صناديق التعاون والإسعاف والتكافل، ومرجع الوكالات القضائية.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
